services:
  simulator:
    build: .
    environment:
      TELTONIKA_HOST: ${TELTONIKA_HOST:?set TELTONIKA_HOST}
      TELTONIKA_PORT: ${TELTONIKA_PORT:-5027}
      TELTONIKA_IMEIS: ${TELTONIKA_IMEIS:?set TELTONIKA_IMEIS}
      TELTONIKA_DEVICE_PROFILE: ${TELTONIKA_DEVICE_PROFILE:-default-codec8e}
      TELTONIKA_ROUTE_FILE: ${TELTONIKA_ROUTE_FILE:-routes/rotterdam-genoa.route.json}
      TELTONIKA_DRIVING_STYLE: ${TELTONIKA_DRIVING_STYLE:-normal}
      TELTONIKA_SEED: ${TELTONIKA_SEED:-1}
      TELTONIKA_INTERVAL_MS: ${TELTONIKA_INTERVAL_MS:-1000}
      TELTONIKA_RECONNECT_DELAY_MS: ${TELTONIKA_RECONNECT_DELAY_MS:-5000}
    init: true
    restart: unless-stopped
