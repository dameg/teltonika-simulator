name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teltonika_test
          POSTGRES_USER: teltonika_test
          POSTGRES_PASSWORD: teltonika-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teltonika_test -d teltonika_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://teltonika_test:teltonika-test@127.0.0.1:5432/teltonika_test
      TEST_DATABASE_URL: postgresql://teltonika_test:teltonika-test@127.0.0.1:5432/teltonika_test

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@company"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:integration
      - run: pnpm run build:library
      - run: pnpm run verify:package
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
