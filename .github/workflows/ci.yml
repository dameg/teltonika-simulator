name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teltonika_test
          POSTGRES_USER: teltonika_test
          POSTGRES_PASSWORD: teltonika-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teltonika_test -d teltonika_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://teltonika_test:teltonika-test@127.0.0.1:5432/teltonika_test
      TEST_DATABASE_URL: postgresql://teltonika_test:teltonika-test@127.0.0.1:5432/teltonika_test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
